<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Isizwe Print & Projects</title>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#16A34A">
  <style>
    /* Adding some basic styling for the new elements */
    .contact-info { font-size: 0.9rem; margin-top: 5px; color: #333; }
    .footer { padding: 20px; background: #f4f4f4; text-align: center; border-top: 1px solid #ddd; margin-top: 40px; }
    .map-link { display: inline-block; margin-top: 10px; color: #16A34A; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<header class="header">
  <div class="header__inner">
    <div class="logo-banner">
      <img src="static/images/isizweprintlogo.jpg" alt="Isizwe Print & Projects">
    </div>

    <div class="brand-text">
      <h1 class="logo">Isizwe Print & Projects</h1>
      <p class="tagline">Order printing services quickly via WhatsApp</p>
      <div class="contact-info">
        <p>📍 15965 Mohlabi Street, Riverside, Kwa Thema, 1575</p>
        <p>📱 WhatsApp: <a href="https://wa.me/27730708651">073 070 8651</a></p>
      </div>
    </div>
  </div>
  <nav id="tabs" class="tabs"></nav>
</header>

<section class="meta">
  <div class="meta__inner">
    <div>
      <h2 id="categoryTitle">Loading…</h2>
      <p id="categoryDesc" class="muted"></p>
    </div>

    <div class="searchbox">
      <input id="search" type="search" placeholder="Search in this category…"/>
      <button id="clearBtn" type="button">Clear</button>
    </div>
  </div>
</section>

<main class="main">
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">No products found.</div>
</main>

<footer class="footer">
  <div class="footer__inner">
    <h3>Find Us</h3>
    <p>15965 Mohlabi Street, Riverside, Kwa Thema, 1575</p>
    <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=15965+Mohlabi+Street+Riverside+Kwa+Thema+1575" target="_blank">
      📍 View on Google Maps
    </a>
  </div>
</footer>

<script src="/static/js/app.js"></script>
</body>
</html>
