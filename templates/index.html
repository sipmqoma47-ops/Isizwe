<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Professional printing services in Kwa Thema. Order business cards, flyers, banners, and more via WhatsApp. Fast, reliable, and affordable."/>
  <meta name="keywords" content="printing services, business cards, flyers, banners, Kwa Thema, Springs, printing company"/>
  <title>Isizwe Print & Projects | Professional Printing Services in Kwa Thema</title>

  <link rel="stylesheet" href="/static/css/app.css"/>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D9488">
  <link rel="icon" type="image/png" href="/static/images/favicon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Isizwe Print & Projects - Professional Printing Services">
  <meta property="og:description" content="Order quality printing services quickly via WhatsApp">
  <meta property="og:image" content="/static/images/isizweprintlogo.jpg">

  <style>
    :root{
      --primary-color:#0D9488;
      --primary-dark:#0F766E;
      --primary-light:#5EEAD4;
      --gray-50:#F9FAFB;
      --gray-100:#F3F4F6;
      --gray-200:#E5E7EB;
      --gray-300:#D1D5DB;
      --gray-700:#374151;
      --gray-900:#111827;
      --border:#E5E7EB;
      --surface:#F9FAFB;
      --text-primary:#111827;
      --text-secondary:#4B5563;
      --font-primary:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
      --font-heading:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      --radius-sm:.25rem;
      --radius-md:.5rem;
      --radius-lg:.75rem;
      --radius-xl:1rem;
      --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
      --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);
      --transition-fast:150ms ease-in-out;
      --transition-base:250ms ease-in-out;
      --spacing-sm:.5rem;
      --spacing-md:1rem;
      --spacing-lg:1.5rem;
      --spacing-xl:2rem;
      --spacing-2xl:3rem;
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:var(--font-primary);
      color:var(--text-primary);
      background-color:var(--surface);
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* HEADER (no white panel) */
    .header{
      background:linear-gradient(135deg,var(--primary-color) 0%,var(--primary-dark) 100%);
      color:#fff;
      box-shadow:var(--shadow-lg);
      position:sticky;
      top:0;
      z-index:1000;
    }

    .header__inner{
      max-width:1400px;
      margin:0 auto;
      padding:var(--spacing-lg) var(--spacing-xl);
      display:grid;
      grid-template-columns:auto 1fr;
      gap:var(--spacing-xl);
      align-items:center;
    }

    .logo-banner{
      width:120px;height:120px;
      border-radius:var(--radius-xl);
      overflow:hidden;
      box-shadow:var(--shadow-xl);
      border:4px solid rgba(255,255,255,.2);
    }
    .logo-banner img{width:100%;height:100%;object-fit:cover;display:block;}

    .brand-text{display:flex;flex-direction:column;gap:.45rem;}

    /* REMOVE ANY WHITE BACKGROUND by force */
    .brand-text, .brand-text *{
      background:transparent !important;
    }

    .logo{
      font-family:var(--font-heading);
      font-size:clamp(1.75rem,4vw,2.6rem);
      font-weight:900;
      letter-spacing:-.02em;
      margin:0;
      text-shadow:0 2px 6px rgba(0,0,0,.18);
    }

    .tagline{
      font-size:clamp(.98rem,2vw,1.15rem);
      font-weight:600;
      color:rgba(255,255,255,.95);
    }

    /* Contact line with clear icons */
    .contact-info{
      display:flex;
      flex-wrap:wrap;
      gap:.65rem 1rem;
      margin-top:.35rem;
      align-items:center;
    }

    .contact-pill{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      padding:.45rem .75rem;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.18);
      border-radius:9999px;
      font-size:.95rem;
      font-weight:600;
      color:#fff;
      backdrop-filter:blur(8px);
    }

    .contact-pill .ic{
      width:28px;height:28px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.18);
      border-radius:9999px;
      font-size:1rem;
      line-height:1;
    }

    .contact-pill a{
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }
    .contact-pill a:hover{ text-decoration:underline; }

    /* tabs */
    .tabs{
      background:rgba(0,0,0,.12);
      border-top:1px solid rgba(255,255,255,.12);
      overflow-x:auto;
      padding:.55rem .75rem;
      white-space:nowrap;
    }

    /* main grid */
    .main{
      max-width:1400px;
      margin:0 auto;
      padding:var(--spacing-2xl) var(--spacing-xl);
      min-height:50vh;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:var(--spacing-xl);
    }
    .empty{
      text-align:center;
      padding:var(--spacing-2xl);
      color:rgba(17,24,39,.65);
      font-size:1.05rem;
      background:#fff;
      border-radius:var(--radius-lg);
      border:2px dashed var(--border);
    }
    .hidden{display:none;}

    /* WhatsApp CTA */
    .whatsapp-cta{position:fixed;bottom:var(--spacing-xl);right:var(--spacing-xl);z-index:999;}
    .whatsapp-button{
      display:flex;align-items:center;gap:.6rem;
      padding:.9rem 1.1rem;
      background:#25D366;color:#fff;text-decoration:none;
      font-weight:800;border-radius:9999px;
      box-shadow:var(--shadow-xl);
      transition:all var(--transition-base);
      font-size:1rem;
    }
    .whatsapp-button:hover{background:#20BA5A;transform:scale(1.05);}
    .whatsapp-icon{font-size:1.35rem;}

    @media (max-width:768px){
      .header__inner{grid-template-columns:1fr;text-align:center;gap:var(--spacing-md);}
      .logo-banner{margin:0 auto;width:100px;height:100px;}
      .brand-text{align-items:center;}
      .contact-info{justify-content:center;}
      .whatsapp-button span:last-child{display:none;}
      .whatsapp-cta{bottom:var(--spacing-md);right:var(--spacing-md);}
      .main{padding:var(--spacing-xl) var(--spacing-md);}
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header" role="banner">
    <div class="header__inner">
      <div class="logo-banner">
        <img src="/static/images/isizweprintlogo.jpg" alt="Isizwe Print & Projects Logo" loading="eager"/>
      </div>

      <div class="brand-text">
        <h1 class="logo">Isizwe Print & Projects</h1>
        <p class="tagline">Professional Printing Services | Order Quickly via WhatsApp</p>

        <!-- CLEAR ICONS + ALWAYS VISIBLE -->
        <div class="contact-info" aria-label="Contact information">
          <div class="contact-pill" title="Address">
            <span class="ic" aria-hidden="true">📍</span>
            <span>15965 Mohlabi Street, Riverside, Kwa Thema, 1575</span>
          </div>

          <div class="contact-pill" title="WhatsApp">
            <span class="ic" aria-hidden="true">💬</span>
            <a href="https://wa.me/27730708651" aria-label="Contact us on WhatsApp">073 070 8651</a>
          </div>
        </div>
      </div>
    </div>

    <nav id="tabs" class="tabs" role="navigation" aria-label="Product categories"></nav>
  </header>

  <!-- ✅ REMOVED: Category Meta Section (category + search) -->

  <!-- Main Product Grid -->
  <main class="main" role="main">
    <div id="grid" class="grid" role="list" aria-label="Products"></div>
    <div id="empty" class="empty hidden" role="status">
      <p>No products found.</p>
    </div>
  </main>

  <!-- WhatsApp Floating CTA -->
  <div class="whatsapp-cta">
    <a
      href="https://wa.me/27730708651?text=Hi%2C%20I%27d%20like%20to%20order%20printing%20services"
      class="whatsapp-button"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Order via WhatsApp"
    >
      <span class="whatsapp-icon">💬</span>
      <span>Order Now</span>
    </a>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
